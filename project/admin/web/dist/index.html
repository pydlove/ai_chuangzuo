    <link rel="stylesheet" crossorigin href="/assets/index-jGhdHuFS.css?v=build-1786608877231">
    <script>window.__APP_VERSION__ = 'build-1786608877231'</script>

  <body>
    <div id="app"></div>
    <script>
      (function () {
        const VERSION_KEY = 'aichuangzuo_admin_app_version'
        const current = (window.__APP_VERSION__ || 'dev').toString()
        const saved = localStorage.getItem(VERSION_KEY)
        if (saved && saved !== current) {
          localStorage.setItem(VERSION_KEY, current)
          // 用新 URL 跳转绕过微信浏览器缓存（reload(true) 对微信不可靠）
          const url = new URL(location.href)
          url.searchParams.set('_v', current)
          location.replace(url.toString())
          return
        }
        localStorage.setItem(VERSION_KEY, current)
      })()
    </script>
  </body>
