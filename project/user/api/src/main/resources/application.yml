server:
  port: 25050
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 1024

spring:
  application:
    name: user-api
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  web:
    resources:
      cache:
        period: 7d
  mail:
    host: ${SPRING_MAIL_HOST:127.0.0.1}
    port: ${SPRING_MAIL_PORT:3025}
    username: ${SPRING_MAIL_USERNAME:test@local}
    password: ${SPRING_MAIL_PASSWORD:local-dev-no-auth}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.ssl.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

auth:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:please-change-this-access-secret-at-least-256-bits-long}
    refresh-secret: ${JWT_REFRESH_SECRET:please-change-this-refresh-secret-at-least-256-bits-long}
    export-secret: ${JWT_EXPORT_SECRET:please-change-this-export-secret-at-least-256-bits-long}
    admin-access-secret: ${ADMIN_JWT_ACCESS_SECRET:please-change-this-admin-access-secret-at-least-256-bits-long}
    access-expiration: 7200
    refresh-expiration: 604800
    remember-me-refresh-expiration: 2592000
    export-expiration: 600
  register:
    max-per-ip: 10

internal:
  api-key: ${INTERNAL_API_KEY:default-change-me}

user:
  model:
    # 与管理端共用同一密钥解密 a_model_config.api_key_encrypted
    api-key-secret: ${ADMIN_MODEL_API_KEY_SECRET:0123456789abcdef0123456789abcdef}
